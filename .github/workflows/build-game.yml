name: Build game downloads

# Portable, zero-install Windows builds of everything:
# - the Godot game
# - the BooruVision camera tool (calibrate/detect) as a single executable,
#   no Python needed on the target PC
#
# macOS builds are currently disabled (Windows focus) - the macOS export
# preset and old matrix entries live in git history.
#
# Every push to main (and manual runs) refreshes the rolling "latest"
# pre-release. Pushing a tag like v1.0 creates a versioned release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5"
  CSEXT_VERSION: "2025.08.21"

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      # Gives the exported game direct webcam access on Windows/Linux
      # (macOS uses Godot's built-in camera backend).
      - name: Add CameraServerExtension
        run: |
          curl -sSL -o csext.zip "https://github.com/j20001970/godot-cameraserver-extension/releases/download/${CSEXT_VERSION}/CameraServerExtension-${CSEXT_VERSION}.zip"
          mkdir -p /tmp/csext
          unzip -q csext.zip -d /tmp/csext
          if [ -d /tmp/csext/addons ]; then
            mv /tmp/csext/addons godot/
          else
            mkdir -p godot/addons
            mv /tmp/csext/* godot/addons/
          fi
          find godot/addons -maxdepth 3 | head -30

      - name: Import project resources
        run: godot --headless --path godot --import || true

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path godot --export-release "Windows Desktop" ../build/windows/DijitaruBooruNage.exe
          cd build/windows
          zip -r ../DijitaruBooruNage-windows.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: game-builds
          path: build/*.zip

  vision:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable executable
        working-directory: vision
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --console --name BooruVision app.py

      - name: Package
        working-directory: vision/dist
        run: Compress-Archive -Path BooruVision.exe -DestinationPath "../../BooruVision-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: vision-windows
          path: BooruVision-*.zip

  release:
    needs: [game, vision]
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true

      - name: List downloads
        run: ls -la downloads

      # Recreate the release instead of updating in place: an in-place
      # update keeps the original publish date and old tag commit on the
      # releases page, which makes fresh builds look stale.
      - name: Delete previous "latest" release and tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" || true

      - name: Publish rolling "latest" release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest build
          prerelease: true
          body: |
            Build #${{ github.run_number }} - commit ${{ github.sha }}

            Automatic Windows build of the newest version. Nothing to install - download, unzip, run.

            - **Game**: `DijitaruBooruNage-windows.zip` - unzip, run the .exe. F = fullscreen.
            - **Camera tool**: `BooruVision-windows.zip` - unzip, double-click `BooruVision.exe`,
              pick from the menu (1 = calibrate, 2 = detect).
              If Windows SmartScreen complains: "More info" > "Run anyway".

            Defaults are tuned for a PS3 Eye (640x480 @ 60 fps) - install its driver first,
            see the README section "Using a PS3 Eye camera".

            Config and calibration files are created next to the executable on first run.
          files: downloads/*.zip

      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: downloads/*.zip
